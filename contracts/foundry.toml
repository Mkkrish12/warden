[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.28"
evm_version = "cancun"

# See more config options https://github.com/foundry-rs/foundry/blob/master/crates/config/README.md#all-options

# Monad testnet — chain id 10143. Reads DEPLOYER_PRIVATE_KEY from the environment
# at deploy time (e.g. forge script ... --rpc-url monad_testnet).
[rpc_endpoints]
monad_testnet = "${MONAD_RPC_URL}"
